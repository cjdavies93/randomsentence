<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence builder</title>
<style>
  :root {
    --paper: #f3f1ec; --ink: #1d2a33; --tile: #ffffff; --tile-edge: #c9c4b8;
    --accent: #1f5f8b; --ok: #1d7a4a; --warn: #b4532a; --muted: #5d6870;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #161b20; --ink: #e8e6e1; --tile: #232a31; --tile-edge: #3a444d;
            --accent: #6fb3e0; --ok: #62c58b; --warn: #f0a06f; --muted: #98a3ab; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: Georgia, "Times New Roman", serif; line-height: 1.5; }
  main { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: 1.75rem; margin: 0 0 .25rem; font-weight: 700; }
  .lead { margin: 0 0 2rem; color: var(--muted); }
  #answer { width: 100%; font: inherit; font-size: 1.25rem; padding: .9rem 1rem;
            color: var(--ink); background: var(--tile); border: 2px solid var(--tile-edge);
            border-radius: 6px; }
  #answer:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #words { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.5rem 0; min-height: 3rem; }
  button { font: inherit; cursor: pointer; }
  .word { font-size: 1.15rem; padding: .5rem .9rem; color: var(--ink); background: var(--tile);
          border: 2px solid var(--tile-edge); border-bottom-width: 4px; border-radius: 6px; }
  .word:hover:not(:disabled) { border-color: var(--accent); }
  .word:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
  .word:disabled { opacity: .3; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .btn { padding: .55rem 1.1rem; border-radius: 6px; border: 2px solid var(--ink);
         background: transparent; color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #10161b; } }
  #result { min-height: 2rem; margin-top: 1.5rem; font-size: 1.4rem; font-weight: 700; }
  #result.ok { color: var(--ok); } #result.no { color: var(--warn); }
  @media (prefers-reduced-motion: reduce) { .word:active:not(:disabled) { transform: none; } }
</style>
</head>
<body>
<main>
  <h1>Sentence builder</h1>
  <p class="lead">Press the words in the right order to rebuild the sentence.</p>

  <input id="answer" type="text" readonly aria-label="Your sentence" placeholder="Your sentence appears here">
  <div id="words" role="group" aria-label="Words"></div>

  <div class="actions">
    <button class="btn primary" id="check">Check</button>
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="reset">Start again</button>
    <button class="btn" id="next">New sentence</button>
  </div>
  <div id="result" role="status" aria-live="polite"></div>
</main>

<script>
  // Used only if sentences.json cannot be loaded (e.g. page opened straight from disk).
  const FALLBACK = [
    "The quick brown fox jumps over the lazy dog.",
    "I would like a cup of tea, please.",
    "Learning a new language takes patience and practice."
  ];

  const $ = id => document.getElementById(id);
  const answer = $("answer"), wordsBox = $("words"), result = $("result");
  let sentences = [], current = "", picked = [];

  const norm = s => s.trim().replace(/\s+/g, " ");

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function render() {
    answer.value = picked.map(p => p.word).join(" ");
  }

  function startRound(keepSentence) {
    if (!keepSentence) {
      let next;
      do { next = sentences[Math.floor(Math.random() * sentences.length)]; }
      while (sentences.length > 1 && next === current);
      current = next;
    }
    const words = norm(current).split(" ");
    let order = shuffle(words);
    if (words.length > 1) {
      let tries = 0;
      while (order.join(" ") === words.join(" ") && tries++ < 20) order = shuffle(words);
    }
    picked = [];
    result.textContent = ""; result.className = "";
    wordsBox.innerHTML = "";
    order.forEach(word => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "word"; b.textContent = word;
      b.addEventListener("click", () => {
        picked.push({ word, btn: b });
        b.disabled = true;
        result.textContent = ""; result.className = "";
        render();
      });
      wordsBox.appendChild(b);
    });
    render();
  }

  $("check").addEventListener("click", () => {
    const ok = norm(answer.value) === norm(current);
    result.textContent = ok ? "Correct, well done!" : "Nearly, try again";
    result.className = ok ? "ok" : "no";
  });
  $("undo").addEventListener("click", () => {
    const last = picked.pop();
    if (last) last.btn.disabled = false;
    result.textContent = ""; result.className = "";
    render();
  });
  $("reset").addEventListener("click", () => startRound(true));
  $("next").addEventListener("click", () => startRound(false));

  fetch("sentences.json")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { sentences = d.sentences; })
    .catch(() => { sentences = FALLBACK; })
    .finally(() => startRound(false));
</script>
</body>
</html>
